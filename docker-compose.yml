services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: viralyz
      POSTGRES_PASSWORD: viralyz
      POSTGRES_DB: viralyz
    volumes:
      - viralyz_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  viralyz_pg:
